<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Singup - StreamVibe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="./Styles/signup.css">
</head>

<body>

    <body>

        <div class="container d-flex justify-content-center px-3">
            <div class="signup-card">
                <div class="text-center">
                    <img src="./images/Logo.png" alt="Logo" class="logo-img">
                    <h2 class="h4 fw-bold mb-4">Create Account</h2>
                </div>

                <a href="./google-ui.html" style="text-decoration: none;">
                    <button class="btn btn-google w-100 mb-3">
                        <img src="./images/devicon_google.png" width="20" alt="Google">
                        Sign in with Google
                    </button>
                </a>


                <div class="divider">OR</div>

                <form>
                    <div class="mb-3">
                        <label class="form-label small text-secondary">Full Name</label>
                        <input type="text" class="form-control rounded-2" placeholder="Enter your name">
                    </div>

                    <div class="mb-3">
                        <label class="form-label small text-secondary">Email Address</label>
                        <input type="email" class="form-control rounded-2" placeholder="Enter your email">
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label small text-secondary">Password</label>
                            <input type="password" class="form-control rounded-2" placeholder="••••••••">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label small text-secondary">Confirm Password</label>
                            <input type="password" class="form-control rounded-2" placeholder="••••••••">
                        </div>
                    </div>

                    <div class="form-check mb-4">
                        <input type="checkbox" class="form-check-input" id="terms">
                        <label class="form-check-label small text-secondary" for="terms">
                            I agree to the <a href="#" class="text-white text-decoration-none fw-bold">Terms &
                                Conditions</a>
                        </label>
                    </div>

                    <a href="./index.html" <button type="submit" class="btn btn-login btn-danger w-100 mb-3">Sign
                        up</button>
                    </a>
                </form>

                <p class="text-center text-secondary small mt-3">
                    Already have an account? <a href="./login.html"
                        class="text-white text-decoration-none fw-bold">Login</a>
                </p>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
    </body>

</html>
