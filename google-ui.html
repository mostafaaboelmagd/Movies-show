<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>google-ui-StreamVibe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="./Styles/google-ui.css">
</head>

<body>

    <div class="google-card">
        <img src="https://upload.wikimedia.org/wikipedia/commons/2/2f/Google_2015_logo.svg" alt="Google" class="logo">

        <h1>Choose an account</h1>
        <p class="subtitle">to continue to <span>StreamVibe</span></p>

        <a href="./index.html" class="account-item"
            style="text-decoration: none; color: inherit; display: flex; align-items: center;">
            <div class="avatar" style="background-color: #1a73e8; color: white;">M</div>
            <div class="details">
                <span class="name" style="display: block;">Mostafa Abo Elmagd</span>
                <span class="email" style="display: block;">mostafa.user@gmail.com</span>
            </div>
        </a>

        <div class="account-item">
            <div class="avatar">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path
                        d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08s5.97 1.09 6 3.08c-1.29 1.94-3.5 3.22-6 3.22z"
                        fill="#5f6368" />
                </svg>
            </div>
            <div class="details">
                <span class="name" style="color: #1a73e8;">Use another account</span>
            </div>
        </div>

        <div class="footer">
            To continue, Google will share your name, email address, language preference, and profile picture with
            StreamVibe.
        </div>
    </div>

</body>

</html>
