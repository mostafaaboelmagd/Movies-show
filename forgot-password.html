<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forgot-password- StreamVibe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="./Styles/forgot-password.css">
</head>

<body>

    <div class="container d-flex justify-content-center align-items-center min-vh-100 px-3">
        <div class="signup-card">
            <div class="text-center">
                <img src="./images/Logo.png" alt="Logo" class="logo-img mb-4">
                <h2 class="h4 fw-bold mb-2">Forgot Password?</h2>
                <p class="text-secondary small mb-4">No worries! Enter your email and we'll send you reset instructions.
                </p>
            </div>

            <form>
                <div class="mb-4">
                    <label class="form-label small text-secondary">Email Address</label>
                    <input type="email" class="form-control rounded-2" placeholder="Enter your email" required>
                </div>

                <button type="submit" class="btn btn-login btn-danger w-100 mb-4">Send Reset Link</button>
            </form>

            <div class="text-center">
                <p class="text-secondary small">
                    Remembered your password?
                    <a href="./login.html" class="text-white text-decoration-none fw-bold">Login</a>
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
